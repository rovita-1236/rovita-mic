<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROVITA｜声で入れる</title>
<style>
:root{color-scheme:light dark;--bg:#f6f4ef;--fg:#1f1f1f;--sub:#6b6b6b;--card:#ffffff;--line:rgba(0,0,0,.12);--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#eceef2;--sub:#9aa0aa;--card:#20232a;--line:rgba(255,255,255,.12);--accent:#7c95ff}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}
#state{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:8px}
#dot{width:12px;height:12px;border-radius:50%;background:var(--sub)}
#dot.on{background:#e03131;animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
#txt{flex:1;min-height:120px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:18px;line-height:1.6;white-space:pre-wrap}
#txt .tmp{color:var(--sub)}
.row{display:flex;gap:10px}
button{flex:1;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.main{background:var(--accent);color:#fff;border-color:transparent}
#note{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div id="state"><span id="dot"></span><span id="msg">準備しています…</span></div>
<div id="txt"></div>
<div class="row">
<button id="more" type="button">続けて話す</button>
<button id="again" type="button">消して言い直す</button>
<button id="done" class="main" type="button">入れる（Enter）</button>
</div>
<div id="note">自動では入りません。「入れる」かEnterを押した時だけ、ROVITAのコメント欄に入ります。Escで閉じます。</div>
<script>
(function(){
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var msg = document.getElementById('msg'), dot = document.getElementById('dot'), box = document.getElementById('txt');
var kept = '', cur = '', tmp = '', rec = null, sent = false;
var target = new URLSearchParams(location.search).get('o') || '';
function show(){ box.innerHTML = ''; box.appendChild(document.createTextNode(kept + cur)); if (tmp) { var s = document.createElement('span'); s.className = 'tmp'; s.textContent = tmp; box.appendChild(s); } }
function stopRec(){ try { if (rec) { rec.onend = null; rec.onresult = null; rec.abort(); } } catch (e) {} rec = null; dot.className = ''; }
function send(){
  if (sent) return;
  var t = (kept + cur + tmp).trim();
  if (!t) { msg.textContent = 'まだ何も聞き取れていません'; return; }
  sent = true; stopRec();
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({type:'rovita-mic', text:t}, target || '*');
    window.close();
  } else { msg.textContent = 'ROVITAの画面が見つかりません。文字を選んでコピーしてください'; sent = false; }
}
function listen(){
  if (!SR) { msg.textContent = 'このブラウザは声の入力に対応していません（ChromeかEdgeで開いてください）'; return; }
  stopRec(); kept = kept + cur + tmp; cur = ''; tmp = '';
  var r = new SR(); rec = r; r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true;
  r.onstart = function(){ dot.className = 'on'; msg.textContent = '聞いています。話し終わったら「入れる」'; };
  r.onresult = function(e){
    var f = '', t = '';
    for (var i = 0; i < e.results.length; i++) { if (e.results[i].isFinal) f += e.results[i][0].transcript; else t += e.results[i][0].transcript; }
    cur = f; tmp = t; show();
  };
  r.onerror = function(e){ if (e.error === 'not-allowed' || e.error === 'service-not-allowed') msg.textContent = 'マイクが許可されていません。アドレスバーの鍵の印からマイクを許可してください'; };
  r.onend = function(){ if (rec !== r) return; rec = null; dot.className = ''; kept = kept + cur + tmp; cur = ''; tmp = ''; show(); msg.textContent = '止まりました。「入れる」か「続けて話す」'; };
  try { r.start(); } catch (e) { msg.textContent = '始められませんでした。「続けて話す」を押してください'; }
}
document.getElementById('more').onclick = function(){ listen(); };
document.getElementById('again').onclick = function(){ stopRec(); kept = ''; cur = ''; tmp = ''; show(); listen(); };
document.getElementById('done').onclick = function(){ send(); };
document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); } if (e.key === 'Escape') window.close(); });
listen();
})();
</script>
</body>
</html>
